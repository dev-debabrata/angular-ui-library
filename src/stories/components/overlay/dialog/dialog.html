@if (visible()) {
  <div
    class="dialog-mask"
    [class]="'dialog-mask--' + position()"
    [class.dialog-mask--modal]="modal()"
    [class.dialog-mask--maximized]="maximized()"
    (click)="onMaskClick()"
  >
    <div
      #panel
      class="dialog"
      role="dialog"
      tabindex="-1"
      [attr.aria-modal]="modal()"
      [attr.aria-labelledby]="headerId"
      [class]="'dialog--' + variant() + (tone() ? ' tone-' + tone() : '')"
      [class.dialog--maximized]="maximized()"
      [style.width]="width()"
      [style.translate]="maximized() ? null : offset()[0] + 'px ' + offset()[1] + 'px'"
      (click)="$event.stopPropagation()"
    >
      <div
        class="dialog-header"
        [class.dialog-header--drag]="draggable() && !maximized()"
        (pointerdown)="draggable() && !maximized() && dragStart($event)"
        (pointermove)="grab && offset.set([$event.clientX - grab[0], $event.clientY - grab[1]])"
        (lostpointercapture)="grab = null"
      >
        @if (icon()) {
          <span class="dialog-icon"
            ><np-icon [name]="icon()" [size]="variant() === 'hero' ? 28 : 18"
          /></span>
        }
        <div class="dialog-heading">
          <h3 class="dialog-title" [id]="headerId">{{ header() }}</h3>
          @if (subtitle()) {
            <p class="dialog-subtitle">{{ subtitle() }}</p>
          }
        </div>
        @if (maximizable()) {
          <button
            type="button"
            class="ui-close"
            [attr.aria-label]="maximized() ? 'Restore' : 'Maximize'"
            (click)="maximized.set(!maximized())"
          >
            <np-icon [name]="maximized() ? 'minimize-2' : 'maximize-2'" [size]="16" />
          </button>
        }
        @if (closable()) {
          <button type="button" class="ui-close" aria-label="Close" (click)="close()">
            <np-icon name="x" [size]="18" />
          </button>
        }
      </div>
      <div class="dialog-body">
        <ng-content />
      </div>
      <div class="dialog-footer"><ng-content select="[dialogFooter]" /></div>
    </div>
  </div>
}
