@if (open()) {
  <div class="modal-backdrop" (click)="close()">
    <div
      class="modal"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="title()"
      (click)="$event.stopPropagation()"
    >
      <div class="modal-header">
        <h3>{{ title() }}</h3>
        <button type="button" class="ui-close" aria-label="Close" (click)="close()">×</button>
      </div>
      <div class="modal-body">
        <ng-content />
      </div>
    </div>
  </div>
}
