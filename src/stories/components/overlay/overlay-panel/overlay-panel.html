@if (visible()) {
  <div
    #panel
    class="overlay-panel"
    popover="manual"
    [class]="'overlay-panel--' + variant()"
    [class.overlay-panel--above]="position()?.placement === 'above'"
    role="dialog"
    [attr.aria-label]="ariaLabel() || header() || null"
    [style.width]="width() || null"
    [style.top.px]="position()?.top"
    [style.left.px]="position()?.left"
    [style.--arrow-left.px]="position()?.arrowLeft"
    [style.visibility]="position() ? null : 'hidden'"
  >
    @if (showCloseIcon()) {
      <button
        type="button"
        class="ui-close overlay-panel-close"
        aria-label="Close"
        (click)="hide()"
      >
        <np-icon name="x" [size]="16" />
      </button>
    }
    @if (header()) {
      <header class="overlay-panel-header">
        @if (icon()) {
          <np-icon [name]="icon()" variant="soft" [size]="32" />
        }
        <strong>{{ header() }}</strong>
      </header>
    }
    <ng-content />
    <footer class="overlay-panel-footer"><ng-content select="[panelFooter]" /></footer>
  </div>
}
