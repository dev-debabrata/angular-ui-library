<section class="voice" [class]="'voice--' + state()" aria-label="Voice assistant">
  <div class="voice__wave" aria-hidden="true">
    @for (bar of bars; track bar) {
      <i [style.--i]="bar"></i>
    }
  </div>

  <button
    type="button"
    class="voice__mic"
    [attr.aria-label]="status()"
    [attr.aria-pressed]="state() === 'listening'"
    [class.nex-anim-ripple]="state() === 'listening'"
    [class.nex-anim-glow]="state() === 'speaking'"
    [disabled]="state() === 'processing'"
    (click)="toggle()"
  >
    <nex-icon [class.nex-anim-spin]="state() === 'processing'" [name]="micIcon()" [size]="30" />
  </button>

  <p class="voice__status" aria-live="polite">{{ status() }}</p>

  @if (state() === 'listening' && typed) {
    <input
      class="ui-control voice__typed"
      aria-label="Type what you would say"
      placeholder="Speech isn't available here. Type and press Enter"
      [value]="transcript()"
      (input)="transcript.set($any($event.target).value)"
      (keydown)="onTypedKeydown($event)"
    />
  }

  <div
    #log
    class="voice__history"
    role="log"
    aria-live="polite"
    [style.max-height]="historyHeight()"
    [hidden]="!messages().length && !transcript()"
  >
    @for (m of messages(); track $index) {
      <div class="voice__msg" [class.voice__msg--me]="m.from === 'me'">
        @if (m.from === 'them') {
          <span class="voice__who"><nex-icon name="bot" [size]="14" /></span>
        }
        <p class="voice__bubble">{{ m.text }}</p>
        @if (m.from === 'me') {
          <span class="voice__who voice__who--me"><nex-icon name="user" [size]="12" /></span>
        }
      </div>
    }
    @if (state() === 'listening' && transcript() && !typed) {
      <div class="voice__msg voice__msg--me">
        <p class="voice__bubble voice__bubble--live">{{ transcript() }}</p>
        <span class="voice__who voice__who--me"><nex-icon name="user" [size]="12" /></span>
      </div>
    }
  </div>
</section>
