<label
  class="toggle"
  [class]="['toggle--' + variant(), 'toggle--' + size(), 'toggle--label-' + labelPosition()]"
  [class.toggle--disabled]="disabled()"
>
  <input
    type="checkbox"
    role="switch"
    [checked]="checked()"
    [disabled]="disabled()"
    (change)="checked.set($any($event.target).checked)"
  />
  <span class="toggle-track">
    @if (variant() === 'labeled') {
      <span class="toggle-text toggle-text--on" aria-hidden="true">{{ onLabel() }}</span>
      <span class="toggle-text toggle-text--off" aria-hidden="true">{{ offLabel() }}</span>
    }
    <span class="toggle-thumb">
      @if (variant() === 'icon') {
        <np-icon class="toggle-icon" [name]="checked() ? onIcon() : offIcon()" [size]="iconSize()" [strokeWidth]="3" />
      }
    </span>
  </span>
  @if (label()) {
    <span class="toggle-label">{{ label() }}</span>
  }
</label>
