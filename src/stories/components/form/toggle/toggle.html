<label class="toggle" [class.toggle--disabled]="disabled()">
  <input
    type="checkbox"
    role="switch"
    [checked]="checked()"
    [disabled]="disabled()"
    (change)="checked.set($any($event.target).checked)"
  />
  <span class="toggle-track"><span class="toggle-thumb"></span></span>
  @if (label()) {
    <span>{{ label() }}</span>
  }
</label>
