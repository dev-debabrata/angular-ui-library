@if (!popup() || visible()) {
  <div
    class="menu mi-panel"
    role="menu"
    [class]="'mi-look-' + variant()"
    [class.mi-float]="popup()"
    [class.mi-kbd]="shortcuts()"
    [npMenuPopover]="popup()"
    [style.top.px]="position()?.top"
    [style.left.px]="position()?.left"
  >
    <div class="menu-slot"><ng-content select="[menuHeader]" /></div>
    @for (item of model(); track $index) {
      @if (item.items && !item.separator) {
        <div class="menu-group" role="presentation">{{ item.label }}</div>
        @for (child of item.items; track $index) {
          <np-menu-item [item]="child" (click)="select($event, child)" />
        }
      } @else {
        <np-menu-item [item]="item" (click)="select($event, item)" />
      }
    }
    <div class="menu-slot"><ng-content select="[menuFooter]" /></div>
  </div>
}
