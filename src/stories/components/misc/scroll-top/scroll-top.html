<button
  type="button"
  class="scroll-top"
  [class]="'scroll-top--' + variant() + (label() ? ' scroll-top--pill' : '')"
  [class.scroll-top--visible]="visible()"
  [class.scroll-top--percent]="percent()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-hidden]="!visible()"
  [tabindex]="visible() ? 0 : -1"
  (click)="scrollUp()"
>
  @if (progress() && !label()) {
    <svg class="scroll-top__ring" viewBox="0 0 56 56" aria-hidden="true">
      <circle class="scroll-top__track" cx="28" cy="28" r="26" />
      <circle
        cx="28"
        cy="28"
        r="26"
        [attr.stroke-dasharray]="ring"
        [attr.stroke-dashoffset]="ring * (1 - ratio())"
      />
    </svg>
  }
  <np-icon [name]="icon()" [size]="label() ? 18 : 22" />
  @if (percent()) {
    <span class="scroll-top__pct">{{ (ratio() * 100).toFixed(0) }}%</span>
  }
  @if (label()) {
    <span>{{ label() }}</span>
  }
</button>
