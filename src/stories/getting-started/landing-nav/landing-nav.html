<nav class="nav" aria-label="NexPrime">
  <a
    class="brand"
    [href]="href(pages.welcome)"
    target="_top"
    [attr.aria-current]="active() === 'home' ? 'page' : null"
  >
    <!-- A lighter tile in dark mode, so it doesn't melt into the dark bar -->
    <img [src]="dark() ? 'nexprime-icon-dark.svg' : 'favicon.svg'" alt="" width="28" height="28" />
    <span>Nex<b>Prime</b></span>
  </a>
  <div class="links">
    @for (link of links; track link.id) {
      <a
        [href]="href(link.path)"
        target="_top"
        [class.active]="active() === link.id"
        [attr.aria-current]="active() === link.id ? 'page' : null"
      >
        {{ link.label }}
      </a>
    }
  </div>
  <div class="tools">
    <button
      type="button"
      class="tool"
      aria-label="Search (Ctrl K)"
      title="Search (Ctrl K)"
      aria-haspopup="dialog"
      (click)="search.open()"
    >
      <np-icon name="search" [size]="18" />
    </button>
    <np-site-search #search />
    <button
      type="button"
      class="tool"
      [attr.aria-label]="dark() ? 'Switch to light mode' : 'Switch to dark mode'"
      [title]="dark() ? 'Light mode' : 'Dark mode'"
      (click)="toggleMode()"
    >
      <np-icon [name]="dark() ? 'sun' : 'moon'" [size]="18" />
    </button>
    <div class="palette">
      <button
        type="button"
        class="tool"
        aria-label="Theme color"
        title="Theme color"
        [attr.aria-expanded]="menuOpen()"
        (click)="menuOpen.set(!menuOpen())"
      >
        <np-icon name="palette" [size]="18" />
      </button>
      @if (menuOpen()) {
        <div class="palette__menu" role="menu" aria-label="Theme color">
          @for (p of palettes; track p.key) {
            <button
              type="button"
              role="menuitemradio"
              class="swatch"
              [class.swatch--on]="p.key === palette()"
              [attr.aria-checked]="p.key === palette()"
              [style.background]="'linear-gradient(135deg, ' + p.primary + ', ' + p.accent + ')'"
              [style.--swatch]="p.primary"
              [attr.aria-label]="p.label"
              [title]="p.label"
              (click)="pickPalette(p.key)"
            >
              @if (p.key === palette()) {
                <np-icon name="check" [size]="16" />
              }
            </button>
          }
        </div>
      }
    </div>
  </div>
  <a class="get-started" [href]="href(pages.getStarted)" target="_top">Get Started</a>
</nav>
