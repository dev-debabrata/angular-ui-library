<nav class="nav" aria-label="NexUI">
  <a
    class="brand"
    [href]="href(pages.welcome)"
    target="_top"
    [attr.aria-current]="active() === 'home' ? 'page' : null"
  >
    <img src="favicon.svg" alt="" width="28" height="28" />
    <span>Nex<b>UI</b></span>
  </a>
  <div class="links">
    @for (link of links; track link.id) {
      <a
        [href]="href(link.path)"
        target="_top"
        [class.active]="active() === link.id"
        [attr.aria-current]="active() === link.id ? 'page' : null"
      >
        {{ link.label }}
      </a>
    }
  </div>
  <div class="tools">
    <a
      class="tool"
      [href]="href(pages.catalog)"
      target="_top"
      aria-label="Search components"
      title="Search components"
    >
      <nex-icon name="search" [size]="18" />
    </a>
    <button
      type="button"
      class="tool"
      [attr.aria-label]="dark() ? 'Switch to light mode' : 'Switch to dark mode'"
      [title]="dark() ? 'Light mode' : 'Dark mode'"
      (click)="toggleMode()"
    >
      <nex-icon [name]="dark() ? 'sun' : 'moon'" [size]="18" />
    </button>
    <div class="palette">
      <button
        type="button"
        class="tool"
        aria-label="Theme color"
        title="Theme color"
        [attr.aria-expanded]="menuOpen()"
        (click)="menuOpen.set(!menuOpen())"
      >
        <nex-icon name="palette" [size]="18" />
      </button>
      @if (menuOpen()) {
        <div class="palette__menu" role="menu" aria-label="Theme color">
          @for (p of palettes; track p.key) {
            <button
              type="button"
              role="menuitem"
              class="swatch"
              [style.background]="'linear-gradient(135deg, ' + p.primary + ', ' + p.accent + ')'"
              [attr.aria-label]="p.label"
              [title]="p.label"
              (click)="pickPalette(p.key)"
            ></button>
          }
        </div>
      }
    </div>
  </div>
  <a class="get-started" [href]="href(pages.getStarted)" target="_top">Get Started</a>
</nav>
