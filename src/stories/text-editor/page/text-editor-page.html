<div class="gallery-page te-page">
  <header class="gallery-hero">
    <span class="gallery-version"><i></i>{{ version }}</span>
    <h1>Text Editor</h1>
    <p class="subtitle">
      A rich text editor you can use right here: write a document, export it to Word, HTML or PDF,
      or try the smaller setups. In your app it's one tag, <code>&lt;np-text-editor&gt;</code>, with
      <code>[(ngModel)]</code> or <code>formControlName</code>.
    </p>
  </header>

  <np-text-editor-demo [mode]="mode()" />
</div>
