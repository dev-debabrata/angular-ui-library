<style>
  /* Top bar and sidebar colors follow NexPrime's light/dark mode and theme color: manager.ts sets data-theme and
     --ui-primary on this page too. The background is the page color, so the sidebar reads as part of the page */
  :root {
    --nav-text: #1e293b;
    --nav-muted: #64748b;
    --nav-bg: #fff;
    --nav-box-border: #e2e8f0;
    --nav-accent: var(--ui-primary, #6366f1);
  }
  :root[data-theme='dark'] {
    --nav-text: #e2e8f0;
    --nav-muted: #94a3b8;
    --nav-bg: #0f172a;
    --nav-box-border: #334155;
  }

  /* #storybook-sidebar-region div:has(> div > .sidebar-header) {
    padding-left: 12px;
  } */
  #storybook-sidebar-region div:has(> .sidebar-header) {
    display: none;
  }
  #storybook-sidebar-region div:has(> .search-field) {
    position: sticky;
    top: 0;
    z-index: 2;
    margin: -16px -12px -12px;
    padding: 16px 12px 12px;
    background: var(--nav-bg);
  }

  /* Docs-style sidebar (like quilljs.com/docs): plain text links without icons, the selected page marked by a bar
     on its left, pages of a group indented behind a thin guide line. Restart Storybook after editing. */

  /* Storybook lists root pages before groups; order moves Icons, Animations and Onboarding below Components */
  .sidebar-item[data-item-id='icons--icons'] {
    order: 1;
  }
  .sidebar-item[data-item-id='animations--animations'] {
    order: 2;
  }
  .sidebar-item[data-item-id='nexlottie--nex-lottie'] {
    order: 4;
  }
  /* The Onboarding group (heading + its rows) goes after them too */
  .sidebar-subheading[data-item-id='onboarding'],
  .sidebar-item[data-item-id^='onboarding-'] {
    order: 3;
  }
  /* The Effects group (particle backgrounds) comes last, after NexLottie */
  .sidebar-subheading[data-item-id='effects'],
  .sidebar-item[data-item-id^='effects-'] {
    order: 5;
  }
  /* The Text Editor page comes after Effects */
  .sidebar-item[data-item-id^='text-editor'] {
    order: 6;
  }
  :has(> .sidebar-item[data-item-id='icons--icons']) {
    display: flex;
    flex-direction: column;
  }

  #storybook-sidebar-region {
    background: var(--nav-bg);
  }

  /* Rows (doubled class beats Storybook's 16px margin above each group) */
  .sidebar-subheading.sidebar-subheading,
  .sidebar-item:not([data-parent-id]) {
    margin: 0;
    border-radius: 0;
    background: transparent !important;
  }
  /* Storybook's "Skip to content" link on the selected row takes up space (and squeezes the label) until focused */
  .sidebar-item > a[href='#storybook-preview-wrapper']:not(:focus) {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
  }
  /* Hidden: "expand all" next to groups and the "⌃ K" hint in the search box (the shortcut still works) */
  .search-field > code,
  .sidebar-subheading .sidebar-subheading-action,
  .sidebar-item[data-item-id='getting-started-welcome--welcome'],
  .sidebar-item[data-item-id='getting-started-welcome'] {
    display: none !important;
  }
  :is(.sidebar-subheading [data-action='collapse-root'], .sidebar-item:not([data-parent-id]) > a) {
    display: flex;
    flex: 1;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
    height: auto;
    min-height: 34px;
    padding: 6px 12px;
    border-radius: 0;
    color: var(--nav-muted);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0;
    text-transform: none;
    white-space: nowrap;
    transition: color 0.15s;
  }
  :is(
    .sidebar-subheading [data-action='collapse-root'],
    .sidebar-item:not([data-parent-id]) > a
  ):hover,
  .sidebar-subheading [aria-expanded='true'] {
    background: transparent;
    color: var(--nav-text);
  }

  /* No icons or chevrons on rows: Storybook's icon wrapper is each link's first child */
  :is(.sidebar-subheading [data-action='collapse-root'], .sidebar-item > :is(a, button))
    > :first-child {
    display: none;
  }

  /* Small chevron on the right of a group; points right when the group is collapsed */
  .sidebar-subheading [data-action='collapse-root']::after {
    content: '';
    width: 14px;
    height: 14px;
    margin-left: auto;
    background: currentColor;
    mask: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23000' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>")
      center / contain no-repeat;
    color: var(--nav-muted);
    opacity: 0.7;
    transition: rotate 0.2s;
  }
  .sidebar-subheading [aria-expanded='false']::after {
    rotate: -90deg;
  }

  /* The dev server adds "+" / "⋯" buttons (the test addon's "Run component tests" menu) and test status icons to
     rows; the sidebar is a plain list of links, so every row keeps only its link (and the "Skip to content" link) */
  .sidebar-item > :first-child ~ :not(a[href='#storybook-preview-wrapper']) {
    display: none !important;
  }

  /* Pages of a group: indented behind a thin guide line */
  .sidebar-item[data-parent-id] {
    margin-left: 12px;
    border-left: 1px solid var(--nav-box-border);
    border-radius: 0;
    background: transparent !important;
  }
  .sidebar-item[data-parent-id] > :is(a, button) {
    min-height: 30px;
    padding-top: 6px;
    padding-bottom: 5px;
    border-radius: 0;
    color: var(--nav-muted) !important;
    font-size: 13.5px;
    font-weight: 400;
    transition: color 0.15s;
  }
  .sidebar-item[data-parent-id]:hover > :is(a, button) {
    color: var(--nav-text) !important;
  }

  /* Components like PrimeNG's docs: groups (Form, Data, …) are small bold headings, always open; each component is
     one link along the guide line (manager.ts opens its first page on click and never expands it), so its stories
     and docs rows are hidden. The current component gets the selected bar from manager.ts (#np-current-component) */
  .sidebar-item[data-nodetype='group'] {
    margin-top: 14px;
    border-left: 0;
  }
  .sidebar-item[data-nodetype='group'] > button {
    min-height: 28px;
    padding-left: 0;
    color: var(--nav-text) !important;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.03em;
    cursor: default;
  }
  .sidebar-item[data-nodetype='component'] > button {
    padding-left: 14px;
  }
  .sidebar-item:is([data-nodetype='story'], [data-nodetype='document']):is(
      [data-parent-id^='components-'],
      [data-parent-id^='effects-'],
      [data-parent-id^='onboarding-']
    ) {
    display: none;
  }

  /* Selected page: text color plus a 2px bar in the theme color over the guide line (or at the row's left edge).
     The current component gets the same look from manager.ts (#np-current-component sets content and the color) */
  .sidebar-item[data-selected='true'] > a {
    color: var(--nav-text) !important;
    font-weight: 500;
  }
  .sidebar-item[data-selected='true']::before {
    content: '';
  }
  .sidebar-item::before {
    position: absolute;
    top: 4px;
    bottom: 4px;
    left: -1px;
    width: 2px;
    border-radius: 2px;
    background: var(--nav-accent);
  }

  /* Top bar (manager.ts) of every page, the site's included. Storybook's layout fills the window below it
     (--np-topbar-h: the bar plus its border; two rows on phones) */
  :root {
    --np-topbar-h: 65px;
  }
  #np-topbar {
    position: relative;
    border-bottom: 1px solid var(--nav-box-border);
    background: var(--nav-bg);
  }
  /* The site's cookie notice is open: the same grey overlay as on the page, which also takes the bar's clicks */
  #np-topbar[data-np-cookie]::after {
    content: '';
    position: absolute;
    z-index: 10;
    inset: 0 0 -1px;
    background: rgba(15, 23, 42, 0.5);
    animation: np-cookie-fade 0.3s ease both;
  }
  @keyframes np-cookie-fade {
    from {
      opacity: 0;
    }
  }
  body {
    overflow: hidden;
    background: var(--nav-bg);
  }
  /* Storybook's layout box is #root's only child (its providers render no elements) */
  #root > div {
    height: calc(100dvh - var(--np-topbar-h));
  }
  /* On the docs and component pages the sidebar and page sit in the same centered 1200px column as the bar's
     content (from the logo to Get Started), with page-colored margins on both sides. The site's pages stay full width */
  [data-np-layout='default'] #root > div {
    max-width: 1200px;
    margin: 0 auto;
  }
  .np-topbar__inner {
    display: flex;
    align-items: center;
    gap: 28px;
    /* About 1200px of content plus the 24px sides (Storybook's page is border-box) */
    max-width: 1258px;
    height: 64px;
    margin: 0 auto;
    padding: 0 24px;
    font-family:
      'Inter',
      system-ui,
      -apple-system,
      'Segoe UI',
      Roboto,
      Helvetica,
      Arial,
      sans-serif;
  }
  #np-topbar a {
    color: inherit;
    text-decoration: none;
  }
  #np-topbar :is(a, button):focus-visible {
    outline: none;
    border-radius: 8px;
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--nav-accent) 35%, transparent);
  }
  .np-topbar__brand {
    display: inline-flex;
    flex: none;
    align-items: center;
    gap: 10px;
    color: var(--nav-text) !important;
    font-size: 20px;
    letter-spacing: 0.04em;
  }
  /* A lighter tile in dark mode, like the site's top bar */
  [data-theme='dark'] .np-topbar__brand img {
    content: url('nexprime-icon-dark.svg');
  }
  .np-topbar__brand b {
    font-weight: 800;
  }
  .np-topbar__links {
    display: flex;
    gap: 4px;
    margin-left: auto;
  }
  .np-topbar__links a,
  .np-topbar__tool {
    border-radius: 10px;
    color: var(--nav-muted) !important;
    transition:
      color 0.15s,
      background 0.15s;
  }
  .np-topbar__links a {
    padding: 8px 12px;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
  }
  :is(.np-topbar__links a, .np-topbar__tool):hover,
  .np-topbar__links a[aria-current] {
    background: color-mix(in srgb, var(--nav-accent) 12%, transparent);
    color: var(--nav-accent) !important;
  }
  .np-topbar__tools {
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .np-topbar__tool {
    display: grid;
    place-items: center;
    width: 36px;
    height: 36px;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
  }
  .np-topbar__palette {
    position: relative;
  }
  .np-topbar__menu {
    position: absolute;
    z-index: 20;
    top: calc(100% + 8px);
    right: 0;
    display: grid;
    grid-template-columns: repeat(4, 28px);
    gap: 10px;
    padding: 14px;
    border: 1px solid var(--nav-box-border);
    border-radius: 16px;
    background: var(--nav-bg);
    box-shadow: 0 12px 32px -8px rgb(15 23 42 / 0.25);
  }
  .np-topbar__menu[hidden] {
    display: none;
  }
  .np-topbar__swatch {
    display: grid;
    place-items: center;
    width: 28px;
    height: 28px;
    padding: 0;
    border: 0;
    border-radius: 8px;
    color: #fff;
    cursor: pointer;
    transition: box-shadow 0.15s;
  }
  .np-topbar__swatch:hover {
    box-shadow:
      0 0 0 2px var(--nav-bg),
      0 0 0 4px var(--nav-box-border);
  }
  /* The current theme color: a ring in its own color and a check mark */
  .np-topbar__swatch--on,
  .np-topbar__swatch--on:hover {
    box-shadow:
      0 0 0 2px var(--nav-bg),
      0 0 0 4px var(--swatch);
  }
  /* Custom colors: a row under the presets with the user's colors and a "+" color picker */
  .np-topbar__custom {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--nav-box-border);
  }
  .np-topbar__custom-title {
    flex-basis: 100%;
    color: var(--nav-muted, #64748b);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .np-topbar__custom-item {
    position: relative;
  }
  /* The × to remove a custom color, on its swatch's corner when hovered */
  .np-topbar__remove {
    position: absolute;
    top: -6px;
    right: -6px;
    display: none;
    place-items: center;
    width: 16px;
    height: 16px;
    padding: 0;
    border: 1px solid var(--nav-box-border);
    border-radius: 50%;
    background: var(--nav-bg);
    color: inherit;
    cursor: pointer;
  }
  .np-topbar__remove svg {
    width: 10px;
    height: 10px;
  }
  .np-topbar__custom-item:hover .np-topbar__remove,
  .np-topbar__remove:focus-visible {
    display: grid;
  }
  .np-topbar__add {
    position: relative;
    display: grid;
    place-items: center;
    width: 28px;
    height: 28px;
    border: 1px dashed var(--nav-box-border);
    border-radius: 8px;
    cursor: pointer;
  }
  .np-topbar__add:hover,
  .np-topbar__add:focus-within {
    border-color: currentColor;
  }
  .np-topbar__add svg {
    width: 16px;
    height: 16px;
  }
  /* The native color input: invisible, over the whole button, so a click opens the picker */
  .np-topbar__add input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
  }
  .np-topbar__start {
    flex: none;
    padding: 9px 16px;
    border-radius: 10px;
    background: var(--nav-text);
    color: var(--nav-bg) !important;
    font-size: 14px;
    font-weight: 700;
    transition: box-shadow 0.15s;
  }
  .np-topbar__start:hover {
    box-shadow: 0 8px 20px -8px rgb(15 23 42 / 0.45);
  }
  /* Tablet spacing, as in responsive.css for the site's bar */
  @media (max-width: 1024px) {
    .np-topbar__inner {
      gap: 16px;
      padding: 0 20px;
    }
    .np-topbar__links a {
      padding: 8px 9px;
    }
  }
  .np-topbar__burger {
    display: none;
  }
  /* Phones: the section links drop down under the bar from the menu button (manager.ts sets data-np-links) */
  @media (max-width: 760px) {
    .np-topbar__inner {
      gap: 8px;
      padding: 0 16px;
    }
    .np-topbar__burger {
      display: grid;
    }
    .np-topbar__links {
      position: absolute;
      z-index: 20;
      inset: 100% 0 auto;
      display: none;
      flex-direction: column;
      gap: 2px;
      margin: 0;
      padding: 8px 12px 12px;
      border-bottom: 1px solid var(--nav-box-border);
      background: var(--nav-bg);
      box-shadow: 0 16px 32px -12px rgb(15 23 42 / 0.25);
    }
    #np-topbar[data-np-links] .np-topbar__links {
      display: flex;
    }
    .np-topbar__links a {
      padding: 12px;
      font-size: 15px;
    }
    .np-topbar__tools {
      margin-left: auto;
    }
    .np-topbar__start {
      padding: 7px 12px;
      font-size: 13px;
    }
  }
  /* "Get Started" is also on the Welcome page; the logo, links and tools keep the row */
  @media (max-width: 400px) {
    .np-topbar__start {
      display: none;
    }
    .np-topbar__brand {
      font-size: 18px;
    }
  }
  /* Phones: Storybook's menu drawer focuses its search when it opens, and a focused search hides the page tree
     (sb-sr-only) behind "Recently opened". Until something is typed, show the tree instead */
  #storybook-mobile-menu:has(#storybook-explorer-searchfield:placeholder-shown) {
    #storybook-explorer-tree.sb-sr-only {
      all: unset !important;
      display: block !important;
    }
    #storybook-explorer-menu > [role='listbox'] {
      display: none;
    }
  }
  /* Toolbar: manager.ts hides Storybook's tools by id; this one is built into the toolbar and has none */
  button[aria-label='Show addon panel'],
  /* Landing pages (manager.ts sets data-np-layout) have no toolbar */
  [data-np-layout='landing'] [data-testid='sb-preview-toolbar'],
  /* Storybook's mobile bottom bar (story name, menu): the top bar's menu button opens the sidebar instead. Its
     section also holds the menu drawer, so only the bar goes */
  section > header.sb-bar {
    display: none !important;
  }
  section:has(> header.sb-bar) {
    border-top: 0 !important;
  }
</style>
