<!-- Storybook's loading screen (spinner, docs skeleton) in the saved light/dark mode and theme color. It paints
     before the stories bundle (and theme.css) loads, so this applies manager.ts's saveTheme() first, and the
     dark colors are theme.css's surface, surface-muted and border tokens. color-scheme darkens the page itself -->
<script>
  try {
    const saved = JSON.parse(localStorage.getItem('np-theme') ?? '{}');
    if (saved.theme === 'dark') document.documentElement.dataset.theme = 'dark';
    for (const [name, value] of Object.entries(saved.vars ?? {}))
      document.documentElement.style.setProperty(name, value);
  } catch {}
</script>
<style>
  .sb-loader {
    border: 3px solid color-mix(in srgb, var(--ui-primary, #6366f1) 22%, transparent);
    border-top-color: var(--ui-primary, #6366f1);
    mix-blend-mode: normal;
  }
  :root[data-theme='dark'] {
    color-scheme: dark;
    --sb-line: #1e293b;
    & :is(.sb-preparing-story, .sb-preparing-docs) {
      background: #0f172a;
    }
    & :is(.sb-previewBlock, .sb-argstableBlock-body td) {
      border-color: var(--sb-line);
      background: #0b1222;
    }
    & :is(.sb-previewBlock_icon, .sb-argstableBlock span, .sb-argstableBlock-body button) {
      background: var(--sb-line);
    }
    & :is(.sb-previewBlock_header, .sb-argstableBlock-body) {
      box-shadow: 0 0 0 1px var(--sb-line);
    }
    & .sb-argstableBlock-body tr {
      border-color: var(--sb-line);
    }
  }
</style>

<!-- "Back to top" button on every Storybook page (docs pages scroll inside this preview frame).
     Same look as <np-scroll-top>, written in plain JS so it doesn't depend on any story. -->
<style>
  #np-docs-top {
    position: fixed;
    right: 24px;
    bottom: 24px;
    z-index: 1000;
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: var(--ui-gradient, linear-gradient(135deg, #6366f1, #a855f7));
    box-shadow: 0 10px 25px rgba(15, 23, 42, 0.18);
    color: #fff;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    scale: 0.6;
    transition:
      opacity 0.25s ease,
      scale 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
      box-shadow 0.16s ease;
  }
  #np-docs-top.is-visible {
    opacity: 1;
    pointer-events: auto;
    scale: 1;
  }
  #np-docs-top:hover {
    box-shadow:
      0 0 0 6px rgba(99, 102, 241, 0.25),
      0 10px 25px rgba(15, 23, 42, 0.18);
  }
  #np-docs-top:focus-visible {
    outline: none;
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.4);
  }
</style>
<script>
  window.addEventListener('DOMContentLoaded', () => {
    const button = document.createElement('button');
    button.id = 'np-docs-top';
    button.type = 'button';
    button.setAttribute('aria-label', 'Back to top');
    button.tabIndex = -1;
    button.innerHTML =
      '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg>';
    button.addEventListener('click', () => {
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      scrollTo({ top: 0, behavior: reduced ? 'auto' : 'smooth' });
    });
    document.body.append(button);

    // Show after scrolling 400px
    const update = () => {
      const visible = scrollY > 400;
      button.classList.toggle('is-visible', visible);
      button.tabIndex = visible ? 0 : -1;
    };
    addEventListener('scroll', update, { passive: true });
    update();
  });
</script>
